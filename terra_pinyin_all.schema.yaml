schema:
  schema_id: terra_pinyin_all
  name: "地球拼音-月七改"
  version: "26.02.03"
  author:
    - 佛振 <chen.sst@gmail.com>
    - mintimate < @Mintimate|https://www.mintimate.cn >
  description: |
    「漢語拼音」，以符號按鍵 - / < \ 輸入四聲
    拼音碼表根據 CC-CEDICT 改編
  dependencies:
    - radical_pinyin # 参考 https://github.com/mirtlecn/rime-radical-pinyin
    - melt_eng # 英文方案
    - rime_frost_aux  # single-char aux lookup

switches:
  - name: ascii_punct
    states: [ "🀄", "🔤" ]
    reset: 1
  - name: emoji_suggestion
    states: [ "🚫", "🧩"]
    reset: 1
  - name: full_shape
    states: [ 半角, 全角 ]
    reset: 0
  - name: tone_display                 #开启后在输入编码的位置实时转换为带声调全拼，不开启则采用系统配置，影响的是preedit_format,归属：super_preedit.lua
    states: [ 调关, 调起 ]
    reset: 0
  - name: chaifen        # 拆字滤镜
    states: [ "🚫", "✂️" ]     # 快捷键 「Control+Shift+C」
    reset: 0
  - name: transcription
    states: [ 简体 , 繁体 ]
    reset: 0


engine:
  processors:
    - lua_processor@*select_character              # 以词定字
    - lua_processor@*codeLengthLimit_processor     # 使用Lua限制输入内容的最大长度(防止过长而卡顿)
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - lua_translator@*date_translator                    # 时间、日期、星期、月份（rime-ice 风格，触发关键字：rq, sj, xq, dt, ts, yf）
    - lua_translator@*uuid                               # UUID
    - lua_translator@*number_translator                  # 金额大小写
    - lua_translator@*lunar                              # 农历（触发关键字：lunar，公历转农历：N20240115）
    - lua_translator@*mint_calculator_translator         # 计算器（lua 动态表达式）
    - punct_translator
    - table_translator@custom_phrase
    - table_translator@melt_eng           # 英文输入（作为子翻译器，优先级需要比原生的低）
    - table_translator@cn_en                             # 中英混合词汇
    - reverse_lookup_translator@radical_reverse_lookup
    - lua_translator@*unicode                           # Unicode 字符输入，如 U62fc 得到「拼」
    - script_translator
    - lua_translator@*force_gc                           # 暴力GC，尝试解决小狼毫长期使用的卡顿
  filters:
    - lua_filter@*corrector               # 错音错字提示
    - lua_filter@*super_preedit                  # 输入码显示全拼并带上音调
    - lua_filter@*autocap_filter           # 英文自动大写
    - lua_filter@*v_filter                    # v 模式 symbols 优先（顺序要求：v_filter > Emoji）
    - lua_filter@*pin_cand_filter             # 置顶候选项（顺序要求：置顶候选项 > Emoji > 简繁切换）
    - lua_filter@*long_word_filter           # 长词优先（顺序要求：长词优先 > Emoji）
    - simplifier@emoji_suggestion         # Emoji OpenCC
    - simplifier@transcription_cc         # 繁体&简体 OpenCC
    - lua_filter@*cn_en_spacer             # 中英混输自动空格
    - lua_filter@*reduce_english_filter    # 降低部分英语单词在候选项的位置
    - lua_filter@*aux_lookup_filter           # 辅码快速过滤
    - lua_filter@*en_spacer               # 英文词条自动空格（倒数第二个位置）
    - lua_filter@*is_in_user_dict          # 用户词典的词加上一个*
    - uniquifier                          # 去重


# 简繁切换
transcription_cc:
  option_name: transcription
  opencc_config: s2t.json             # s2t.json | s2hk.json | s2tw.json | s2twp.json
  tips: none                          # 转换提示: all 都显示 | char 仅单字显示 | none 不显示。
  excluded_types: [ reverse_lookup ]  # 不转换反查（两分拼字）的内容

# Emoji模块
emoji_suggestion:
  opencc_config: emoji.json
  option_name: emoji_suggestion
  tips: all
  inherit_comment: false

 # 最大输入长度
codeLengthLimit_processor: 28

# Lua 配置: 日期、时间、星期、ISO 8601、时间戳、月份的触发关键字（rime-ice 风格）
date_translator:
  date: rq       # 日期： 2022-11-29
  time: sj       # 时间： 18:13
  week: xq       # 星期： 星期二
  datetime: dt   # ISO 8601： 2022-11-29T18:13:11+08:00
  timestamp: ts  # 时间戳： 1669716794
  month: yf      # 月份： January / Jan

# Lua 配置：农历的触发关键字和模板
lunar: lunar  # 农历：输入 lunar 获取当前日期农历，输入 N20240115 公历转农历
lunar_template: "{干支年}{生肖}年{俗称农历月}{农历日}"  # 可用字段：{干支年} {农历月} {农历日} {生肖} {俗称农历月} {简记农历日} {星期} {节气}

# Lua 配置: 生成 UUID 的触发关键字
uuid: uuid

# Lua 配置：长词优先
# 提升 count 个词语，插入到第 idx 个位置。
# 示例：将 2 个词插入到第 4、5 个候选项，输入 jie 得到「1接 2解 3姐 4饥饿 5极恶 6结 7界……」
long_word_filter:
  count: 2
  idx: 4

# Lua 配置: 置顶候选项
# 注释太长了，请参考 pin_cand_filter.lua 开头的说明书。
# pin_cand_filter.lua 末尾有常见编码可供直接复制参考
pin_cand_filter:
  # 格式：编码<Tab>字词1<Space>字词2……
  # 示例：
  # - d	的
  # - m	吗 嘛
  # - hm	后面
  # 固定 lianji 的分词方式为 lian ji（两个音节），避免被切分为 li an ji
  - 'lian ji	联机 连击'

# Lua 配置: 降低部分英语单词在候选项的位置。
# 详细介绍 https://dvel.me/posts/make-rime-en-better/#短单词置顶的问题
# 正常情况： 输入 rug 得到 「1.rug 2.如果 …… 」
# 降低之后： 输入 rug 得到 「1.如果 2.rug …… 」
reduce_english_filter:
    mode: all  # all | none | custom | 『留白』
    idx: 2        # 降低到第 idx 个位置
    # 自定义的单词列表，示例列表没有降低部分常用单词，如 and cat mail Mac but bad shit ……
    words: [aid, ann,
    bail, bait, bam, band, bans, bat, bay, bend, bent, benz, bib, bid, bien, biz, boc, bop, bos, bud, buf,
    cab, cad, cain, cam, cans, cap, cas, cef, chad, chan, chap, chef, cher, chew, chic, chin, chip, chit, coup, cum, cunt, cur,
    dab, dag, dal, dam, dent, dew, dial, diet, dim, din, dip, dis, dit, doug, dub, dug, dunn,
    fab, fax, fob, fog, foul, fur,
    gag, gail, gain, gal, gam, gaol, ged, gel, ger, guam, gus, gut,
    hail, ham, hank, hans, hat, hay, heil, heir, hem, hep, hud, hum, hung, hunk, hut,
    jim, jug,
    kat,
    lab, lad, lag, laid, lam, laos, lap, lat, lax, lay, led, leg, lex, liam, lib, lid, lied, lien, lies, linn, lip, lit, liz, lob, lug, lund, lung, lux,
    mag, maid, mann, mar, mat, med, mel, mend, mens, ment, mil, mins, mint, mob, moc, mop, mos, mot, mud, mug, mum, nail,
    nap, nat, nay, neil, nib, nip, noun, nous, nun, nut,
    pac, paid, pail, pain, pair, pak, pal, pam, pans, pant, pap, par, pat, paw, pax, pens, pic, pier, pies, pins, pint, pit, pix, pod, pop, pos, pot, pour, pow, pub,
    rand, rant, rent, rep, res, ret, rex, rib, rid, rig, rim, rub, rug, rum, runc, runs,
    sac, sail, sal, sam, sans, sap, saw, sax, sew, sham, shaw, shin, sig, sin, sip, sis, suit, sung, suns, sup, sur, sus,
  tad, tail, taj, tar, tax, tec, ted, tel, ter, tex, tic, tied, tier, ties, tim, tin, tit, tour, tout, tum, me,
    wag, wand, womens, wap, wax, weir, won,
    yan, yen]


# Lua 配置：辅码快速过滤
frost_aux_filter:
  trigger_key: "`"  # 辅码过滤触发键


speller:
  alphabet: 'zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA-;/<,>\'
  # initials 定义仅作为始码的按键，排除-;/<,>\'
  initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  delimiter: " '"
  algebra:
    - xform/^([a-zA-Z]+)$/$1①/        # 万象词组 Start
    - xform/^(.*)ā(.*)$/$1a$2①/
    - xform/^(.*)á(.*)$/$1a$2②/
    - xform/^(.*)ǎ(.*)$/$1a$2③/
    - xform/^(.*)à(.*)$/$1a$2④/

    - xform/^(.*)ō(.*)$/$1o$2①/
    - xform/^(.*)ó(.*)$/$1o$2②/
    - xform/^(.*)ǒ(.*)$/$1o$2③/
    - xform/^(.*)ò(.*)$/$1o$2④/

    - xform/^(.*)ē(.*)$/$1e$2①/
    - xform/^(.*)é(.*)$/$1e$2②/
    - xform/^(.*)ě(.*)$/$1e$2③/
    - xform/^(.*)è(.*)$/$1e$2④/

    - xform/^(.*)ī(.*)$/$1i$2①/
    - xform/^(.*)í(.*)$/$1i$2②/
    - xform/^(.*)ǐ(.*)$/$1i$2③/
    - xform/^(.*)ì(.*)$/$1i$2④/

    - xform/^(.*)ū(.*)$/$1u$2①/
    - xform/^(.*)ú(.*)$/$1u$2②/
    - xform/^(.*)ǔ(.*)$/$1u$2③/
    - xform/^(.*)ù(.*)$/$1u$2④/

    - xform/^(.*)ǖ(.*)$/$1v$2①/
    - xform/^(.*)ǘ(.*)$/$1v$2②/
    - xform/^(.*)ǚ(.*)$/$1v$2③/
    - xform/^(.*)ǜ(.*)$/$1v$2④/
    - xform/^(.*)ü(.*)$/$1v$2①/
    - xlit/①②③④/1234                  # 万象 END
    - xform/^r5$/er5/
    - erase/^xx$/
    - derive/^([zcs])h/$1/ # zh, ch, sh => z, c, s
    - derive/^([zcs])([^h])/$1h$2/ # z, c, s => zh, ch, sh
    - derive/([aei])n$/$1ng/ # en => eng, in => ing
    - derive/([aei])ng$/$1n/ # eng => en, ing => in
    - derive/([iu])an$/$lang/ # ian => iang, uan => uang
    - derive/([iu])ang$/$lan/ # iang => ian, uang => uan
    - derive/([aeiou])ng$/$1gn/        # dagn => dang
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/  # zho => zhong|zhou
    - derive/ong$/on/                  # zhonguo => zhong guo
    - derive/ao$/oa/                   # hoa => hao
    - derive/([iu])a(o|ng?)$/a$1$2/    # tain => tian
    - abbrev/^([a-z])[a-z]*$/$1/       # 简拼（首字母）
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ve/$1ue/
    - derive/^([jqxy])u/$1v/
    - derive/([dtnlgkhrzcs])un/$1uen/
    - derive/ui/uei/
    - derive/iu/iou/
    - derive/ao/oa/
    - derive/([aeiou])ng/$1gn/
    - derive/([iu])a(o|ng?)/a$1$2/
    - derive/^([a-z]+)[0-5]$/$1/
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/
    - derive/ong$/on/
    - 'erase/^.*5$/'
    - 'xlit 1234 -/<\'
    - 'derive/^(.*)-$/$1;/'
    - 'derive/^(.*)<$/$1,/'
    - 'derive/^(.*)\\$/$1>/'

translator:
  dictionary: terra_pinyin_all
  initial_quality: 1.2
  spelling_hints: 3  # ～字以內候選標註完整帶調拼音
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([nl])üen/$1uen/
    - xform/([jqxy])v/$1u/
    - xform/eh/ê/
    - 'xform ([aeiou])(ng?|r)([-;/<,>\\]) $1$3$2'
    - 'xform ([aeo])([iuo])([-;/<,>\\]) $1$3$2'
    - 'xform a[-;] ā'
    - 'xform a/ á'
    - 'xform a[<,] ǎ'
    - 'xform a[>\\] à'
    - 'xform e[-;] ē'
    - 'xform e/ é'
    - 'xform e[<,] ě'
    - 'xform e[>\\] è'
    - 'xform o[-;] ō'
    - 'xform o/ ó'
    - 'xform o[<,] ǒ'
    - 'xform o[>\\] ò'
    - 'xform i[-;] ī'
    - 'xform i/ í'
    - 'xform i[<,] ǐ'
    - 'xform i[>\\] ì'
    - 'xform u[-;] ū'
    - 'xform u/ ú'
    - 'xform u[<,] ǔ'
    - 'xform u[>\\] ù'
    - 'xform ü[-;] ǖ'
    - 'xform ü/ ǘ'
    - 'xform ü[<,] ǚ'
    - 'xform ü[>\\] ǜ'
  comment_format:
    - xform ([aeiou])(ng?|r)([1234]) $1$3$2
    - xform ([aeo])([iuo])([1234]) $1$3$2
    - xform a1 ā
    - xform a2 á
    - xform a3 ǎ
    - xform a4 à
    - xform e1 ē
    - xform e2 é
    - xform e3 ě
    - xform e4 è
    - xform o1 ō
    - xform o2 ó
    - xform o3 ǒ
    - xform o4 ò
    - xform i1 ī
    - xform i2 í
    - xform i3 ǐ
    - xform i4 ì
    - xform u1 ū
    - xform u2 ú
    - xform u3 ǔ
    - xform u4 ù
    - xform v1 ǖ
    - xform v2 ǘ
    - xform v3 ǚ
    - xform v4 ǜ
    - xform/([nljqxy])v/$1ü/
    - xform/eh[0-5]?/ê/
    - xform/([a-z]+)[0-5]/$1/
  enable_user_dict: true         # 开启用户词典，根据用户输入调频（默认开启，此处再次声明）

custom_phrase:
  dictionary: ""
  user_dict: custom_phrase
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 1

melt_eng:
  dictionary: melt_eng           # 英文词典
  enable_sentence: false         # 关闭自动造句
  enable_completion: false       # 关闭自动提示
  initial_quality: 0.8


# 中英混合词汇
cn_en:
  dictionary: ""
  user_dict: dicts/en_dicts/cn_en
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 0.5
  comment_format:
    - xform/^.+$//

radical_reverse_lookup:
  tag: radical_lookup
  dictionary: radical_pinyin
  enable_completion: true
  prefix: "Uu"
  preedit_format:
    - xform/([nljqxy])v/$1ü/
  comment_format:
    - xform/([nljqxy])v/$1ü/
    - xform ([aeiou])(ng?|r)([1234]) $1$3$2
    - xform ([aeo])([iuo])([1234]) $1$3$2
    - xform a1 ā
    - xform a2 á
    - xform a3 ǎ
    - xform a4 à
    - xform e1 ē
    - xform e2 é
    - xform e3 ě
    - xform e4 è
    - xform o1 ō
    - xform o2 ó
    - xform o3 ǒ
    - xform o4 ò
    - xform i1 ī
    - xform i2 í
    - xform i3 ǐ
    - xform i4 ì
    - xform u1 ū
    - xform u2 ú
    - xform u3 ǔ
    - xform u4 ù
    - xform v1 ǖ
    - xform v2 ǘ
    - xform v3 ǚ
    - xform v4 ǜ
    - xform/([nljqxy])v/$1ü/
    - xform/eh[0-5]?/ê/
    - xform/([a-z]+)[0-5]/$1/
  tips: 〔拆字〕


reverse_lookup:
  tags: [radical_lookup]
  overwrite_comment: false


punctuator:
  import_preset: symbols
  # 定义部分半角字符
  half_shape:
      "#": "#"
      "*": "*"
      '.' : { commit: 。 }
      "`": "`"
      "~": "~"
      "@": "@"
      "=": "="
      "/": ["/", "÷"]
      '\': "、"
      "_" : "──"
      "'": {pair: ["「", "」"]}
      "[": ["【", "["]
      "]": ["】", "]"]
      "$": ["¥", "$", "€", "£", "¢", "¤"]
      "<": ["《", "〈", "«", "<"]
      ">": ["》", "〉", "»", ">"]

recognizer:
  import_preset: default
  patterns:
    url: "^[a-z]+[.].+$"
    punct: "^[/v]([0-9]0?|[a-zA-Z]+)$"  # 支持 / 和 v 两种模式的符号输入
    unicode: "^U[0-9A-Fa-f]+$"          # Unicode 字符输入，如 U62fc 得到「拼」
    radical_lookup: "Uu[a-z]*'?$"
    rmb: "^R[0-9]+[.]?[0-9]*"        # 响应 lua_translator@number_translator 脚本将自动获取第 2 个字符作为触发前缀
    expression: "^=.*$"              # 响应 lua_translator@mint_calculator_translator 脚本将自动获取第 2 个字符作为触发前缀
    gregorian_to_lunar: "^N[0-9]{1,8}"  # 响应 lua_translator@Chinese_lunar_calendar 公历转农历，输入 N20240115 得到「二〇二四年腊月初五」，脚本将自动获取第 2 个字符作为触发前缀
    uppercase: ""  # 覆写默认的 uppercase 使其可以在输入大写后，输入数字


key_binder:
  import_preset: default
  bindings:
    - {accept: "Control+Shift+E", toggle: emoji_suggestion, when: always}   # Emoji 快捷键
    - {accept: "Control+Shift+1", toggle: transcription, when: has_menu}           # 当存在候选菜单时，可以切换简体和繁体
    - {accept: "Control+Shift+exclam", toggle: transcription, when: has_menu}      # 当存在候选菜单时，可以切换简体和繁体（小狼毫可能读取这个）
    - {accept: "Control+Shift+T", toggle: tone_display, when: has_menu}      # 音调显示开关
    - {accept: "Control+Shift+C", toggle: chaifen, when: has_menu}          # 拆字滤镜开关
    # 映射小键盘数字键,丶,回车可以在计算器中使用
    - { when: composing, accept: "KP_0", send: "0" }
    - { when: composing, accept: "KP_1", send: "1" }
    - { when: composing, accept: "KP_2", send: "2" }
    - { when: composing, accept: "KP_3", send: "3" }
    - { when: composing, accept: "KP_4", send: "4" }
    - { when: composing, accept: "KP_5", send: "5" }
    - { when: composing, accept: "KP_6", send: "6" }
    - { when: composing, accept: "KP_7", send: "7" }
    - { when: composing, accept: "KP_8", send: "8" }
    - { when: composing, accept: "KP_9", send: "9" }
    - { when: composing, accept: "KP_Decimal", send: "." }
    - { when: composing, accept: "KP_Enter", send: Return }
    # 小键盘运算符以在计算器中使用
    - { when: composing, accept: "KP_Add", send: "+" }
    - { when: composing, accept: "KP_Subtract", send: "-" }
    - { when: composing, accept: "KP_Multiply", send: "*" }
    - { when: composing, accept: "KP_Divide", send: "/" }


menu:
  # 候选词个数
  page_size: 4